name: Build 360T7 Firmware

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://github.com/PoorMilk/NW874-ImmortalWrt
  REPO_BRANCH: main
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Initialize Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gsettings-desktop-schemas python3-setuptools libglib2.0-dev libgmp3-dev libmpc-dev libmpfr-dev libssl-dev libtool python3-pyelftools python3-yaml subversion uglifyjs git asciidoc xmlto gettext xsltproc libz-dev rsync ccache zlib1g-dev gawk unzip libncurses-dev gcc-multilib g++-multilib file wget
          sudo timedatectl set-timezone "${{ env.TZ }}"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone Source Code
        working-directory: /workdir
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH immortalwrt
          ln -sf /workdir/immortalwrt $GITHUB_WORKSPACE/immortalwrt

      - name: Cache DL & Ccache
        uses: actions/cache@v4
        with:
          path: |
            immortalwrt/dl
            immortalwrt/.ccache
          key: ${{ runner.os }}-build-${{ hashFiles('immortalwrt/include/scan.mk') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Update Feeds & Execute DIY Scripts
        run: |
          chmod +x ${{ env.DIY_P1_SH }} ${{ env.DIY_P2_SH }}
          ./${{ env.DIY_P1_SH }}
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cd $GITHUB_WORKSPACE
          [ -e ${{ env.CONFIG_FILE }} ] && cp -f ${{ env.CONFIG_FILE }} immortalwrt/.config
          cd immortalwrt
          $GITHUB_WORKSPACE/${{ env.DIY_P2_SH }}
          cat <<EOF >> .config
          CONFIG_CCACHE=y
          CONFIG_PACKAGE_libiwinfo=y
          CONFIG_PACKAGE_libiwinfo-data=y
          CONFIG_PACKAGE_libiwinfo-lua=y
          EOF

      - name: Download Packages
        working-directory: ./immortalwrt
        run: |
          make defconfig
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        working-directory: ./immortalwrt
        run: |
          make -j$(nproc) || make -j1 || make -j1 V=s

      - name: Prepare Artifacts & Tags
        run: |
          mkdir -p release
          find immortalwrt/bin/targets/ -name "*sysupgrade.bin" -exec cp {} release/NW874-sysupgrade.bin \;
          find immortalwrt/bin/targets/ -name "*factory.bin" -exec cp {} release/NW874-factory.bin \;
          cd release
          sha256sum * > sha256sums.txt 2>/dev/null || true
          echo "TAG_NAME=360T7-$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV
          echo "RELEASE_NAME=360T7 ImmortalWrt $(date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          generate_release_notes: false

      - name: Clean Old Releases
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate repos/${{ github.repository }}/releases \
            --jq 'sort_by(.created_at) | reverse | .[5:] | .[]? | "\(.id) \(.tag_name)"' \
            | while read -r id tag; do
                [ -n "$id" ] && gh api -X DELETE repos/${{ github.repository }}/releases/$id || true
                [ -n "$tag" ] && gh api -X DELETE repos/${{ github.repository }}/git/refs/tags/$tag || true
              done

      - name: Clean Old Workflow Runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          keep_minimum_runs: 5
